name: CI

on:
  push:
    branches: [main]
  pull_request:

# Quyền tối thiểu: workflow chỉ cần đọc mã nguồn.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Chỉ để prisma validate/generate đọc cấu hình; test không kết nối DB thật.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cinema_ticket_system?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Kiểm tra Prisma schema
        run: |
          npx prisma validate
          npx prisma generate
      - name: Sơ đồ ERD phải khớp schema
        run: |
          node scripts/generate-erd.js
          git diff --exit-code docs/erd.md
      - name: Build
        run: npm run build --prefix backend
      - name: Unit test
        run: npm test --prefix backend
      - name: E2E test (Prisma/Redis giả lập, kết nối Socket.IO thật)
        run: npm run test:e2e --prefix backend

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build image backend và frontend
        run: |
          docker build -f backend/Dockerfile -t cinema-backend .
          docker build -t cinema-frontend frontend
